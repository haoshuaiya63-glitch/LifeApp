name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          SDKM=$(ls /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "Using sdkmanager: $SDKM"
          yes | $SDKM --licenses || true
          $SDKM "platforms;android-34" "build-tools;34.0.0"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Prepare www from repo root
        run: |
          mkdir -p www
          shopt -s dotglob
          for f in *; do
            case "$f" in
              www|.git|.github|config.xml|platforms|plugins|node_modules|res) ;;
              *) cp -r "$f" www/ ;;
            esac
          done
          ls -la www

      - name: Create transparent splash icon
        run: |
          mkdir -p res
          python3 - <<'EOF'
          import zlib, struct
          def ch(t, d):
              c = struct.pack('>I', len(d)) + t + d
              return c + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          raw = b'\x00\x00\x00\x00\x00'
          png = (b'\x89PNG\r\n\x1a\n'
                 + ch(b'IHDR', struct.pack('>IIBBBBB', 1, 1, 8, 6, 0, 0, 0))
                 + ch(b'IDAT', zlib.compress(raw))
                 + ch(b'IEND', b''))
          open('res/transparent.png', 'wb').write(png)
          EOF

      - name: Add platform and plugins
        run: |
          cordova platform add android@13
          cordova plugin add cordova-plugin-media
          cordova plugin add cordova-plugin-file
          cordova plugin add cordova-plugin-geolocation
          cordova plugin add cordova-plugin-android-permissions

      - name: Build debug APK
        run: cordova build android --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
